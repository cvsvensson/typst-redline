name: Release

# A pushed tag v* builds the binaries and publishes them as a GitHub release.
# Run by hand (workflow_dispatch), it only builds them and keeps them as workflow artifacts.
on:
  push:
    tags: ["v[0-9]+.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      # Static CRT, so the Windows binary does not need the VC++ redistributable.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - id: build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: typst-redline
          target: ${{ matrix.target }}
          # Pure-Rust dependencies: plain cargo builds every target on these runners, no `cross` needed.
          build-tool: cargo
          locked: true
          include: LICENSE,README.md
          checksum: sha256
          # Uploading to the release happens in the release job, with the only write permission.
          dry-run: true
          dry-run-intended: true
      - uses: actions/upload-artifact@v7
        with:
          name: typst-redline-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.tar || steps.build.outputs.zip }}
            ${{ steps.build.outputs.sha256 }}
          if-no-files-found: error

  # One .vsix per platform, with that platform's binary inside. Packaged on Linux so that
  # the executable bit of the Unix binaries is kept; the script fails if it is lost.
  vsix:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
      - run: |
          package() { # <rust target> <vsce target>
            dir="$RUNNER_TEMP/dist/typst-redline-$1"
            mkdir "$dir/x"
            case $1 in *windows*) unzip -q "$dir"/*.zip -d "$dir/x" ;; *) tar xzf "$dir"/*.tar.gz -C "$dir/x" ;; esac
            ./package-vsix.sh "$2" "$(find "$dir/x" -type f -name 'typst-redline*' ! -name '*.sha256' | head -n 1)"
          }
          package x86_64-unknown-linux-musl linux-x64
          package aarch64-unknown-linux-musl linux-arm64
          package x86_64-apple-darwin darwin-x64
          package aarch64-apple-darwin darwin-arm64
          package x86_64-pc-windows-msvc win32-x64
      - uses: actions/upload-artifact@v7
        with:
          name: typst-redline-vsix
          path: vscode/*.vsix
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: test "v$(cargo pkgid | sed 's/.*[#@]//')" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}

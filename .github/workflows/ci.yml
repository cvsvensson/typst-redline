name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Each typst start scans the system fonts, which is slow where many are installed;
      # the tests use the fonts embedded in Typst.
      TYPST_IGNORE_SYSTEM_FONTS: "true"
    steps:
      - uses: actions/checkout@v7
      # The runner's preinstalled stable Rust: updating it costs up to half a minute on Windows.
      # The lint job checks with the latest stable.
      - uses: Swatinem/rust-cache@v2
      # The tests skip compilation silently when typst is missing; keep in step with typst-syntax in Cargo.toml.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: cargo test --locked

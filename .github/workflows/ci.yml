name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, typst ${{ matrix.typst }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        typst: ["0.15.1"]
        include:
          - { os: ubuntu-latest, typst: "0.14.2" }
    runs-on: ${{ matrix.os }}
    env:
      # Each typst start scans the system fonts, which is slow where many are installed;
      # the tests use the fonts embedded in Typst.
      TYPST_IGNORE_SYSTEM_FONTS: "true"
    steps:
      - uses: actions/checkout@v7
      # The runner's preinstalled stable Rust: updating it costs up to half a minute on Windows.
      # The lint job checks with the latest stable.
      - uses: Swatinem/rust-cache@v2
      # The tests skip compilation silently when typst is missing. The newest version is the one
      # typst-syntax in Cargo.toml parses; keep the two in step.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - run: cargo test --locked

  # Lists the output pages that differ between the base and the head of a pull request, so that
  # only those need looking at. Differences do not fail the job.
  output-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only these files can change the output or the sweep; the pages are rendered only if the
      # pull request touches one of them.
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(src/|Cargo\.(toml|lock)$|tests/(fixtures/|output-diff\.sh$)|docs/.*\.(typ|sh|bib|svg|png|jpg|csv|json|toml|yaml|yml)$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Output sweep skipped: the pull request changes no file that affects the output." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changed.outputs.run == 'true'
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - if: steps.changed.outputs.run == 'true'
        run: |
          command -v pdftoppm && command -v compare || {
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends poppler-utils imagemagick
          }
      # Both builds share the dependencies in target/. Cargo takes the two crates for one, as they
      # have the same name and version, so the base crate is cleaned before the head build.
      - if: steps.changed.outputs.run == 'true'
        run: |
          cargo build --release --locked --manifest-path base/Cargo.toml --target-dir target
          mv target/release/typst-redline "$RUNNER_TEMP/typst-redline-base"
          cargo clean --release --package typst-redline --manifest-path base/Cargo.toml --target-dir target
          cargo build --release --locked
      - if: steps.changed.outputs.run == 'true'
        run: tests/output-diff.sh "$RUNNER_TEMP/typst-redline-base" target/release/typst-redline output-diff base
      - if: steps.changed.outputs.run == 'true' && hashFiles('output-diff/changes/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: output-diff
          retention-days: 7
          path: |
            output-diff/summary.md
            output-diff/changes
          if-no-files-found: ignore

  vscode:
    runs-on: ubuntu-latest
    env:
      TYPST_IGNORE_SYSTEM_FONTS: "true"
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      # The extension tests run target/release/typst-redline.
      - run: cargo build --release --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      # The tests start VS Code, which needs a display.
      - run: xvfb-run -a npm test

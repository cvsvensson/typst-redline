[package]
name = "typst-redline"
version = "0.1.0"
edition = "2024"
description = "Editor's proof for Typst: the new version of a document with changes against an old version marked"
license = "MIT"
keywords = ["typst", "diff", "latexdiff"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/cvsvensson/typst-redline"
readme = "README.md"
rust-version = "1.92"
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# The archives of the release workflow hold the binary at their top level.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
similar = "3.2.1"
typst-syntax = "0.15.1"
